services:
  app:
    image: "${APP_IMAGE:-parking-app:latest}"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL for shared PostgreSQL}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY. Generate it with openssl rand -hex 32}"
      APP_TIME_ZONE: "${APP_TIME_ZONE:-Europe/Moscow}"
      ACCESS_TOKEN_EXPIRE_HOURS: "${ACCESS_TOKEN_EXPIRE_HOURS:-12}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      INITIAL_ADMIN_USERNAMES: "${INITIAL_ADMIN_USERNAMES:?Set INITIAL_ADMIN_USERNAMES for first LDAP admins}"
      LDAP_URL: "${LDAP_URL:-}"
      LDAP_BIND_DN: "${LDAP_BIND_DN:-}"
      LDAP_BIND_PASSWORD: "${LDAP_BIND_PASSWORD:-}"
      LDAP_USER_SEARCH_BASE: "${LDAP_USER_SEARCH_BASE:-}"
      LDAP_USER_FILTER: "${LDAP_USER_FILTER:-(sAMAccountName={username})}"
      LDAP_USER_FULL_NAME_ATTRIBUTE: "${LDAP_USER_FULL_NAME_ATTRIBUTE:-displayName}"
      LDAP_TLS_VALIDATE: "${LDAP_TLS_VALIDATE:-true}"
      LDAP_CA_CERT_FILE: "${LDAP_CA_CERT_FILE:-}"
      LDAP_CONNECT_TIMEOUT: "${LDAP_CONNECT_TIMEOUT:-5}"
    ports:
      - target: 80
        published: ${FRONTEND_PORT:-8080}
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - parking_net
    deploy:
      mode: replicated
      replicas: ${APP_REPLICAS:-2}
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

networks:
  parking_net:
    driver: overlay

